name: Job Monitor

on:
  schedule:
    - cron: '*/10 * * * *'  # runs every 10 minutes (was hourly)
  workflow_dispatch:          # allows manual trigger from GitHub UI
  repository_dispatch:        # allows external trigger via GitHub API
    types: [upstream_pr_merged]

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history so we can diff properly
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with upstream
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/SimplifyJobs/New-Grad-Positions.git
          git fetch upstream

          # Pull latest from your own fork first
          git pull origin dev

          # Save the commit hash BEFORE merging so we can diff against it later
          BEFORE=$(git rev-parse HEAD)
          echo "before=$BEFORE" >> $GITHUB_OUTPUT

          # Merge upstream changes
          git merge upstream/dev --no-edit

          # Only push if something actually changed
          if [ "$(git rev-parse HEAD)" != "$BEFORE" ]; then
            git push origin HEAD:dev --force
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No new upstream changes detected."
          fi

      - name: Set up Python
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.sync.outputs.changed == 'true'
        run: pip install openai

      - name: Run job monitor
        if: steps.sync.outputs.changed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SINCE_COMMIT: ${{ steps.sync.outputs.before }}
        run: python .github/scripts/isGoodScript.py