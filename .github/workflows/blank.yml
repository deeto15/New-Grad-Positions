name: Job Monitor

on:
  schedule:
    - cron: '0 * * * *'  # runs every hour
  workflow_dispatch:       # allows manual trigger from GitHub UI

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history so we can diff properly
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with upstream
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/SimplifyJobs/New-Grad-Positions.git
          git fetch upstream

          # Pull latest from your own fork first
          git pull origin dev

          # Save the commit hash BEFORE merging so we can diff against it later
          echo "before=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

          # Merge upstream changes
          git merge upstream/dev --no-edit

          # Push merged changes back to your fork
          git push origin HEAD:dev --force

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openai

      - name: Run job monitor
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SINCE_COMMIT: ${{ steps.sync.outputs.before }}
        run: python scripts/monitor_jobs.py